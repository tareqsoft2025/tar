<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تذكير</title>
<script>try{var t=JSON.parse(localStorage.getItem('theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>html,body{background:transparent!important;min-height:100vh;margin:0;overflow:hidden}</style>
</head>
<body>
<div id="host"></div>
<script src="remind-ui.js"></script>
<script>
// تُفتح من أندرويد فوق كل الشاشات: reminder.html#<JSON>
(function () {
  var R = window.ReminderBridge || null;
  var data = {};
  try { data = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  function close() { if (R) R.close(); }
  if (data.type === 'att') {
    RemindUI.showAttendance(document.getElementById('host'), data, {
      close: close,
      view: function () { if (R && R.openTab) R.openTab('hr'); else close(); }
    });
    return;
  }
  RemindUI.show(document.getElementById('host'), data, {
    done: function () { RemindUI.markDone(data.tid, data.ds); if (R) R.done(); else close(); },
    snooze: function (m) { if (R) R.snooze(m); else close(); },
    open: function () { if (R) R.open(); },
    close: close
  });
})();
</script>
</body>
</html>
