<!doctype html>
<html><head><meta charset="utf-8"><title>hr-sync</title></head>
<body>
<script src="lib/adhan.umd.min.js"></script>
<script src="places.js"></script>
<script src="core.js"></script>
<script src="tracker.js"></script>
<script src="hr-data.js"></script>
<script>
// تُشغَّل في الخلفية من HrSyncJob: نفس المزامنة التراكمية دون فتح التطبيق
(async function () {
  let ok = true;
  try {
    if (window.AndroidBridge) {
      const quick = location.hash === '#quick';
      const st = await HR.sync(null, quick ? { quick: true, background: true } : { background: true });
      const ev = st ? HR.alertFilter(st.fresh) : [];
      if (ev.length && AndroidBridge.attAlert) {
        const tf = new Intl.DateTimeFormat('ar-PS-u-nu-latn', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: Core.TZ });
        const last = ev[ev.length - 1], t = tf.format(new Date(last.ts));
        const title = ev.length > 1 ? ev.length + ' تسجيلات حضور جديدة' : last.name;
        const body = ev.length > 1 ? ev.slice(-4).map((v) => v.name + ' ' + (v.kind === 'in' ? 'دخول' : 'خروج')).join('، ') : (last.kind === 'in' ? 'سجّل دخوله ' : 'سجّل انصرافه ') + t + (last.late > 0 ? ' · متأخر ' + last.late + ' د' : '') + (last.st === 'outside' ? ' · خارج نطاق الموقع' : '');
        AndroidBridge.attAlert(JSON.stringify({ type: 'att', events: ev }), title, body);
      }
    }
  } catch (e) { ok = false; /* retry next time */ }
  // الملخص الصباحي مرة يومياً حتى والتطبيق مغلق (يُحفظ أيضاً في مركز الإشعارات)
  try {
    const d = window.AndroidBridge && AndroidBridge.digestNotify ? HR.maybeDigest() : null;
    if (d) AndroidBridge.digestNotify(d.title, d.body, d.first || 'inbox');
  } catch (e) { /* ignore */ }
  if (window.AndroidBridge) AndroidBridge.done(ok);
})();
</script>
</body></html>
